<title>ToDo管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500&family=Zen+Maru+Gothic:wght@700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..600,0..1,-50..200&display=swap">
<style>
  :root {
    --bg: #f8f9fa;
    --surface: #ffffff;
    --surface-hover: #f1f3f4;
    --border: #dadce0;
    --border-strong: #c4c7c5;
    --text: #202124;
    --text-secondary: #5f6368;
    --text-faint: #80868b;

    --blue: #1a73e8;
    --blue-hover: #1765cc;
    --blue-soft: rgba(26, 115, 232, 0.08);
    --blue-soft-strong: rgba(26, 115, 232, 0.16);
    --blue-ink: #ffffff;

    --red: #d93025;
    --red-soft: rgba(217, 48, 37, 0.08);
    --red-soft-strong: rgba(217, 48, 37, 0.14);

    --amber: #975500;
    --amber-fill: #f9ab00;
    --amber-soft: rgba(249, 171, 0, 0.14);

    --green: #188038;
    --green-fill: #34a853;
    --green-soft: rgba(52, 168, 83, 0.12);

    --shadow-1: 0 1px 2px rgba(60, 64, 67, 0.08), 0 1px 3px rgba(60, 64, 67, 0.10);
    --shadow-2: 0 2px 6px rgba(60, 64, 67, 0.12), 0 4px 12px rgba(60, 64, 67, 0.10);

    --font-body: "Roboto", "Hiragino Kaku Gothic ProN", "Yu Gothic", Arial, sans-serif;
    --font-mono: "Roboto Mono", ui-monospace, "SF Mono", monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #202124;
      --surface: #292a2d;
      --surface-hover: #35363a;
      --border: #3c4043;
      --border-strong: #5f6368;
      --text: #e8eaed;
      --text-secondary: #9aa0a6;
      --text-faint: #80868b;

      --blue: #8ab4f8;
      --blue-hover: #aecbfa;
      --blue-soft: rgba(138, 180, 248, 0.16);
      --blue-soft-strong: rgba(138, 180, 248, 0.26);
      --blue-ink: #14181f;

      --red: #f28b82;
      --red-soft: rgba(242, 139, 130, 0.16);
      --red-soft-strong: rgba(242, 139, 130, 0.26);

      --amber: #fdd663;
      --amber-fill: #fdd663;
      --amber-soft: rgba(253, 214, 99, 0.18);

      --green: #81c995;
      --green-fill: #81c995;
      --green-soft: rgba(129, 201, 149, 0.16);

      --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.35), 0 1px 3px rgba(0, 0, 0, 0.3);
      --shadow-2: 0 2px 6px rgba(0, 0, 0, 0.4), 0 6px 16px rgba(0, 0, 0, 0.35);
    }
  }

  :root[data-theme="dark"] {
    --bg: #202124;
    --surface: #292a2d;
    --surface-hover: #35363a;
    --border: #3c4043;
    --border-strong: #5f6368;
    --text: #e8eaed;
    --text-secondary: #9aa0a6;
    --text-faint: #80868b;

    --blue: #8ab4f8;
    --blue-hover: #aecbfa;
    --blue-soft: rgba(138, 180, 248, 0.16);
    --blue-soft-strong: rgba(138, 180, 248, 0.26);
    --blue-ink: #14181f;

    --red: #f28b82;
    --red-soft: rgba(242, 139, 130, 0.16);
    --red-soft-strong: rgba(242, 139, 130, 0.26);

    --amber: #fdd663;
    --amber-fill: #fdd663;
    --amber-soft: rgba(253, 214, 99, 0.18);

    --green: #81c995;
    --green-fill: #81c995;
    --green-soft: rgba(129, 201, 149, 0.16);

    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.35), 0 1px 3px rgba(0, 0, 0, 0.3);
    --shadow-2: 0 2px 6px rgba(0, 0, 0, 0.4), 0 6px 16px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }

  .material-symbols-outlined {
    font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
    font-size: 20px;
    line-height: 1;
    user-select: none;
    display: inline-block;
  }
  .material-symbols-outlined.filled { font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24; }
  .material-symbols-outlined.sm { font-size: 16px; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px 80px;
  }

  .sheet { width: 100%; max-width: 780px; }

  header {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
  }

  .app-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: var(--blue);
    color: var(--blue-ink);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  h1 {
    font-family: "Zen Maru Gothic", var(--font-body);
    font-size: 25px;
    font-weight: 700;
    color: var(--blue);
    margin: 0;
    letter-spacing: 0.03em;
  }

  .theme-switch {
    display: flex;
    gap: 2px;
    background: var(--surface-hover);
    border-radius: 100px;
    padding: 3px;
    margin-left: auto;
  }
  .theme-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border: none;
    background: transparent;
    color: var(--text-faint);
    border-radius: 100px;
    cursor: pointer;
  }
  .theme-btn .material-symbols-outlined { font-size: 19px; }
  .theme-btn:hover { color: var(--text); }
  .theme-btn[aria-pressed="true"] { background: var(--surface); color: var(--blue); box-shadow: var(--shadow-1); }
  .theme-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }

  /* ---------- composer ---------- */

  .composer {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-1);
  }

  .composer-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .composer-row .material-symbols-outlined { color: var(--blue); flex-shrink: 0; }

  .composer input[type="text"]#task-input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 15px;
    color: var(--text);
    background: transparent;
    border: none;
    padding: 6px 0;
  }
  .composer input[type="text"]#task-input:focus { outline: none; }
  .composer input[type="text"]#task-input::placeholder { color: var(--text-faint); }

  .add-btn {
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    color: var(--blue-ink);
    background: var(--blue);
    border: none;
    border-radius: 8px;
    padding: 8px 18px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .add-btn:hover { background: var(--blue-hover); }
  .add-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .add-btn:disabled { opacity: 0.5; cursor: default; }

  .composer-detail {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  .detail-field {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-secondary);
  }
  .detail-field .material-symbols-outlined { font-size: 18px; color: var(--text-faint); }

  .detail-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-faint);
    flex-shrink: 0;
  }

  .detail-field input[type="date"],
  .detail-field input[type="text"] {
    font: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 8px;
  }
  .detail-field input[type="date"] { font-family: var(--font-mono); width: 142px; }
  .detail-field input[type="text"] { width: 160px; }
  .detail-field input:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }

  .priority-group { display: flex; align-items: center; gap: 6px; }
  .priority-picker { display: flex; gap: 4px; }
  .priority-chip {
    font: inherit;
    font-size: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    border-radius: 100px;
    padding: 5px 12px;
    cursor: pointer;
  }
  .priority-chip[data-active="true"][data-level="high"] { background: var(--red-soft); border-color: var(--red); color: var(--red); }
  .priority-chip[data-active="true"][data-level="mid"] { background: var(--amber-soft); border-color: var(--amber-fill); color: var(--amber); }
  .priority-chip[data-active="true"][data-level="low"] { background: var(--surface-hover); border-color: var(--border-strong); color: var(--text); }
  .priority-chip:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }

  /* ---------- search & filter ---------- */

  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; }

  .search-box {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 9px 14px;
  }
  .search-box:focus-within { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
  .search-box .material-symbols-outlined { color: var(--text-faint); flex-shrink: 0; }
  .search-box input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 14px;
    color: var(--text);
    background: transparent;
    border: none;
  }
  .search-box input:focus { outline: none; }
  .search-box input::placeholder { color: var(--text-faint); }
  .search-clear {
    border: none;
    background: transparent;
    color: var(--text-faint);
    cursor: pointer;
    display: flex;
    border-radius: 100px;
    padding: 2px;
  }
  .search-clear:hover { color: var(--text); background: var(--surface-hover); }

  .filter-toggle {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 100px;
    color: var(--text-secondary);
    cursor: pointer;
  }
  .filter-toggle:hover { background: var(--surface-hover); }
  .filter-toggle[aria-pressed="true"] { background: var(--blue-soft); border-color: var(--blue); color: var(--blue); }
  .filter-toggle:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .filter-toggle .badge {
    position: absolute;
    top: -4px;
    right: -4px;
    background: var(--blue);
    color: var(--blue-ink);
    font-family: var(--font-mono);
    font-size: 10px;
    width: 16px;
    height: 16px;
    border-radius: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .filter-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin: -6px 0 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .filter-group { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .filter-group .filter-label {
    font-size: 12px;
    color: var(--text-faint);
    width: 56px;
    flex-shrink: 0;
  }

  .chip {
    font: inherit;
    font-size: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-secondary);
    border-radius: 100px;
    padding: 5px 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .chip:hover { background: var(--surface-hover); }
  .chip[aria-pressed="true"] { background: var(--blue-soft); border-color: var(--blue); color: var(--blue); font-weight: 500; }
  .chip:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }

  .due-select {
    font: inherit;
    font-size: 12px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 5px 10px;
  }

  .filter-clear {
    align-self: flex-start;
    font: inherit;
    font-size: 12px;
    color: var(--blue);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 2px 0;
  }
  .filter-clear:hover { text-decoration: underline; }

  /* ---------- view switch ---------- */

  .view-switch {
    display: flex;
    gap: 4px;
    background: var(--surface-hover);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 16px;
    width: fit-content;
  }
  .view-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    background: transparent;
    border: none;
    border-radius: 7px;
    padding: 7px 14px;
    cursor: pointer;
  }
  .view-btn .material-symbols-outlined { font-size: 18px; }
  .view-btn:hover { color: var(--text); }
  .view-btn[aria-pressed="true"] { background: var(--surface); color: var(--blue); box-shadow: var(--shadow-1); }
  .view-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }

  /* ---------- tabs ---------- */

  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
  }

  .tab {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 10px 12px;
    cursor: pointer;
    margin-bottom: -1px;
  }
  .tab:hover { color: var(--text); background: var(--surface-hover); border-radius: 6px 6px 0 0; }
  .tab:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
  .tab[aria-selected="true"] { color: var(--blue); border-bottom-color: var(--blue); }
  .tab .count { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); }
  .tab[aria-selected="true"] .count { color: var(--blue); }

  /* ---------- bulk bar ---------- */

  .bulk-bar {
    display: flex;
    justify-content: flex-end;
    gap: 4px;
    margin-bottom: 8px;
  }

  .text-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    color: var(--blue);
    background: transparent;
    border: none;
    border-radius: 8px;
    padding: 7px 10px;
    cursor: pointer;
  }
  .text-btn .material-symbols-outlined { font-size: 17px; }
  .text-btn:hover:not(:disabled) { background: var(--blue-soft); }
  .text-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  .text-btn:disabled { color: var(--text-faint); cursor: default; }
  .text-btn.danger { color: var(--red); }
  .text-btn.danger:hover:not(:disabled) { background: var(--red-soft); }
  .text-btn.danger:disabled { color: var(--text-faint); }

  /* ---------- list & rows ---------- */

  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }

  .row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow-1);
    transition: border-color 0.1s ease;
  }
  .row.drag-over-before, .board-card.drag-over-before { border-top: 2px solid var(--blue); }
  .row.drag-over-after, .board-card.drag-over-after { border-bottom: 2px solid var(--blue); }
  .row.dragging, .board-card.dragging { opacity: 0.5; }

  .row-main {
    display: flex;
    align-items: flex-start;
    gap: 4px;
    padding: 10px 10px 10px 4px;
  }

  .drag-handle, .card-handle {
    color: var(--text-faint);
    cursor: grab;
    display: flex;
    align-items: center;
    padding: 6px 2px;
    flex-shrink: 0;
    opacity: 0.35;
  }
  .row:hover .drag-handle, .board-card:hover .card-handle { opacity: 1; }
  .drag-handle:active, .card-handle:active { cursor: grabbing; }

  .status-btn {
    flex-shrink: 0;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    padding: 6px 4px;
    border-radius: 100px;
    color: var(--text-faint);
  }
  .status-btn:hover { background: var(--surface-hover); }
  .status-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
  .status-btn[data-status="inprogress"] { color: var(--amber-fill); }
  .status-btn[data-status="done"] { color: var(--green-fill); }

  .row-body, .card-text-wrap { flex: 1; min-width: 0; padding: 6px 0; }

  .row-text {
    font-size: 14.5px;
    line-height: 1.5;
    word-break: break-word;
    cursor: text;
  }
  .row[data-status="done"] .row-text, .board-card[data-status="done"] .row-text { color: var(--text-faint); text-decoration: line-through; }

  .row-text-input {
    width: 100%;
    font: inherit;
    font-size: 14.5px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--blue);
    border-radius: 6px;
    padding: 4px 6px;
  }
  .row-text-input:focus { outline: none; }

  .meta-line {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
  }

  .due-field {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 11.5px;
    color: var(--text-secondary);
    background: var(--surface-hover);
    border-radius: 100px;
    padding: 2px 9px 2px 9px;
  }
  .due-field .material-symbols-outlined { font-size: 14px; color: var(--text-faint); flex-shrink: 0; }
  .due-field .date-arrow { font-size: 11px; color: var(--text-faint); flex-shrink: 0; }
  .due-field input[type="date"] {
    font: inherit;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-secondary);
    background: transparent;
    border: none;
    width: 86px;
  }
  .due-field input[type="date"]:focus-visible { outline: 1px solid var(--blue); border-radius: 4px; }
  .due-field[data-due="overdue"] { background: var(--red-soft-strong); color: var(--red); }
  .due-field[data-due="overdue"] input,
  .due-field[data-due="overdue"] .material-symbols-outlined,
  .due-field[data-due="overdue"] .date-arrow { color: var(--red); }
  .due-field[data-due="today"] { background: var(--amber-soft); color: var(--amber); }
  .due-field[data-due="today"] input,
  .due-field[data-due="today"] .material-symbols-outlined,
  .due-field[data-due="today"] .date-arrow { color: var(--amber); }

  .tag-chip {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 11.5px;
    color: var(--blue);
    background: var(--blue-soft);
    border-radius: 100px;
    padding: 3px 6px 3px 9px;
  }
  .tag-chip button {
    border: none;
    background: transparent;
    color: inherit;
    cursor: pointer;
    display: flex;
    padding: 1px;
    opacity: 0.7;
  }
  .tag-chip button:hover { opacity: 1; }

  .tag-add { display: inline-flex; align-items: center; }
  .tag-add input {
    font: inherit;
    font-size: 11.5px;
    color: var(--text-secondary);
    background: transparent;
    border: 1px dashed var(--border-strong);
    border-radius: 100px;
    padding: 3px 9px;
    width: 74px;
  }
  .tag-add input:focus { outline: none; border-color: var(--blue); width: 110px; }
  .tag-add input::placeholder { color: var(--text-faint); }

  .subtask-toggle {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font: inherit;
    font-size: 11.5px;
    color: var(--text-secondary);
    background: var(--surface-hover);
    border: none;
    border-radius: 100px;
    padding: 3px 9px 3px 7px;
    cursor: pointer;
  }
  .subtask-toggle:hover { background: var(--border); }
  .subtask-toggle .material-symbols-outlined { font-size: 14px; }

  .row-actions, .card-actions { display: flex; align-items: flex-start; gap: 0; flex-shrink: 0; }
  .icon-btn {
    border: none;
    background: transparent;
    color: var(--text-faint);
    cursor: pointer;
    display: flex;
    align-items: center;
    padding: 6px;
    border-radius: 100px;
    opacity: 0;
  }
  .row:hover .icon-btn, .row:focus-within .icon-btn,
  .board-card:hover .icon-btn, .board-card:focus-within .icon-btn { opacity: 1; }
  .icon-btn:hover { background: var(--surface-hover); color: var(--text); }
  .icon-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; opacity: 1; }
  .icon-btn.delete:hover { color: var(--red); background: var(--red-soft); }
  .icon-btn.priority[data-level="high"] { color: var(--red); opacity: 1; }
  .icon-btn.priority[data-level="mid"] { color: var(--amber-fill); opacity: 1; }
  .icon-btn.priority[data-level="low"] { color: var(--text-faint); opacity: 1; }

  .subtask-panel {
    border-top: 1px solid var(--border);
    padding: 8px 12px 10px 40px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .subtask-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .subtask-row .status-btn { padding: 3px; }
  .subtask-row .material-symbols-outlined { font-size: 18px; }
  .subtask-text { flex: 1; font-size: 13px; }
  .subtask-row[data-done="true"] .subtask-text { color: var(--text-faint); text-decoration: line-through; }
  .subtask-del {
    border: none;
    background: transparent;
    color: var(--text-faint);
    cursor: pointer;
    display: flex;
    padding: 3px;
    border-radius: 100px;
    opacity: 0;
  }
  .subtask-row:hover .subtask-del { opacity: 1; }

  .subtask-add { display: flex; align-items: center; gap: 8px; padding: 5px 0 2px; }
  .subtask-add .material-symbols-outlined { font-size: 18px; color: var(--text-faint); }
  .subtask-add input {
    flex: 1;
    font: inherit;
    font-size: 13px;

    background: transparent;

    padding: 4px 2px;
  }

  .empty {
    text-align: center;
    color: var(--text-faint);
    font-size: 13.5px;
    padding: 48px 20px;
    border: 1px dashed var(--border);
    border-radius: 12px;
  }

  /* ---------- board (kanban) ---------- */

  .board { display: flex; gap: 12px; align-items: flex-start; overflow-x: auto; padding-bottom: 8px; }
  .board-col { flex: 1 1 0; min-width: 250px; background: var(--surface-hover); border-radius: 12px; padding: 10px; }
  .board-col-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 6px 10px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
  }
  .board-col-header .count {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-faint);
    background: var(--surface);
    border-radius: 100px;
    padding: 1px 7px;
  }
  .board-col-body {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 48px;
    border-radius: 8px;
    padding: 2px;
    transition: background 0.1s ease;
  }
  .board-col-body.drag-over-col { background: var(--blue-soft-strong); }
  .board-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 8px 8px 4px;
    box-shadow: var(--shadow-1);
  }
  .card-top { display: flex; align-items: flex-start; gap: 2px; }
  .board-empty {
    font-size: 12px;
    color: var(--text-faint);
    text-align: center;
    padding: 16px 6px;
    border: 1px dashed var(--border);
    border-radius: 8px;
  }

  /* ---------- gantt ---------- */

  .gantt-note { font-size: 12px; color: var(--text-faint); margin: -6px 0 12px; }
  .gantt-scroll {
    overflow-x: auto;
    overflow-y: hidden;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    max-width: 100%;
  }
  .gantt-table { position: relative; }
  .gantt-header-row, .gantt-row { display: flex; }
  .gantt-header-row { height: 36px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 2; }
  .gantt-row { height: 40px; border-bottom: 1px solid var(--border); }
  .gantt-row:last-child { border-bottom: none; }
  .gantt-name-cell {
    position: sticky;
    left: 0;
    z-index: 1;
    width: 160px;
    flex-shrink: 0;
    height: 100%;
    background: var(--surface);
    padding: 0 10px;
    font-size: 12.5px;
    display: flex;
    align-items: center;
    gap: 6px;
    border-right: 1px solid var(--border);
  }
  .gantt-header-row .gantt-name-cell { font-weight: 500; color: var(--text-secondary); z-index: 3; }
  .gantt-name-cell .material-symbols-outlined { font-size: 16px; flex-shrink: 0; }
  .gantt-name-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gantt-row[data-status="done"] .gantt-name-text { color: var(--text-faint); text-decoration: line-through; }
  .gantt-days-header { display: flex; }
  .gantt-day-cell {
    flex-shrink: 0;
    width: 32px;
    height: 100%;
    font-size: 10px;
    font-family: var(--font-mono);
    color: var(--text-faint);
    display: flex;
    align-items: center;
    justify-content: center;
    border-right: 1px solid var(--border);
  }
  .gantt-day-cell.weekend { background: var(--surface-hover); }
  .gantt-day-cell.today { color: var(--blue); font-weight: 700; }
  .gantt-track { position: relative; flex-shrink: 0; height: 100%; }
  .gantt-track-bg {
    position: absolute;
    inset: 0;
    background-image: repeating-linear-gradient(to right, transparent, transparent 31px, var(--border) 31px, var(--border) 32px);
    opacity: 0.6;
  }
  .gantt-body { position: relative; }
  .gantt-bar {
    position: absolute;
    top: 6px;
    height: 28px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    padding: 0 8px;
    overflow: hidden;
  }
  .gantt-bar-label { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gantt-bar[data-status="notstarted"] { background: var(--surface-hover); border: 1px solid var(--border-strong); color: var(--text-secondary); }
  .gantt-bar[data-status="inprogress"] { background: var(--amber-soft); border: 1px solid var(--amber-fill); color: var(--amber); }
  .gantt-bar[data-status="done"] { background: var(--green-soft); border: 1px solid var(--green-fill); color: var(--green); opacity: 0.8; }
  .gantt-bar[data-priority="high"] { border-left: 3px solid var(--red); }
  .gantt-today-line { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--blue); z-index: 1; }

  @media (max-width: 480px) {
    .detail-field input[type="text"] { width: 120px; }
    .filter-group .filter-label { width: 100%; }
    .board-col { min-width: 220px; }
  }
</style>

<div class="sheet">
  <header>
    <div class="app-icon"><span class="material-symbols-outlined">checklist</span></div>
    <h1>ToDo管理</h1>
    <div class="theme-switch" id="theme-switch" role="radiogroup" aria-label="テーマ">
      <button type="button" class="theme-btn" data-theme-value="system" title="端末の設定に合わせる">
        <span class="material-symbols-outlined">brightness_auto</span>
      </button>
      <button type="button" class="theme-btn" data-theme-value="light" title="ライト(白)">
        <span class="material-symbols-outlined">light_mode</span>
      </button>
      <button type="button" class="theme-btn" data-theme-value="dark" title="ダーク(黒)">
        <span class="material-symbols-outlined">dark_mode</span>
      </button>
    </div>
  </header>

  <form class="composer" id="composer">
    <div class="composer-row">
      <span class="material-symbols-outlined">add_circle</span>
      <input type="text" id="task-input" placeholder="タスクを入力…" autocomplete="off" maxlength="200" />
      <button type="submit" class="add-btn">追加</button>
    </div>
    <div class="composer-detail">
      <label class="detail-field">
        <span class="material-symbols-outlined">event_upcoming</span>
        <span class="detail-label">開始</span>
        <input type="date" id="draft-start" />
      </label>
      <label class="detail-field">
        <span class="material-symbols-outlined">calendar_today</span>
        <span class="detail-label">期限</span>
        <input type="date" id="draft-due" />
      </label>
      <div class="priority-group">
        <span class="detail-label">優先度</span>
        <div class="priority-picker" id="draft-priority" role="radiogroup" aria-label="優先度"></div>
      </div>
      <label class="detail-field">
        <span class="material-symbols-outlined">local_offer</span>
        <span class="detail-label">タグ</span>
        <input type="text" id="draft-tags" placeholder="仕事、プライベートなど" list="tag-list" />
      </label>

  <datalist id="tag-list"></datalist>

  <div class="toolbar">
    <label class="search-box">
      <span class="material-symbols-outlined">search</span>

        <span class="material-symbols-outlined sm">close</span>

    </label>
    <button type="button" class="filter-toggle" id="filter-toggle" aria-pressed="false" title="フィルタ">
      <span class="material-symbols-outlined">tune</span>
      <span class="badge" id="filter-badge" style="display:none">0</span>
    </button>
  </div>

  <div class="filter-panel" id="filter-panel" style="display:none">
    <div class="filter-group">
      <span class="filter-label">タグ</span>
      <div id="filter-tags"></div>
    </div>
    <div class="filter-group">
      <span class="filter-label">優先度</span>
      <div id="filter-priority"></div>
    </div>
    <div class="filter-group">
      <span class="filter-label">期限</span>

  <div class="view-switch" id="view-switch" role="radiogroup" aria-label="表示切替">

    </button>

  <div class="tabs" role="tablist" id="tabs"></div>

  <div class="board" id="board" style="display:none"></div>

  <div id="gantt-container" style="display:none">

    <div class="gantt-scroll"><div id="gantt-table"></div></div>
  </div>
</div>

<script>
  (function () {
    "use strict";

    var STORAGE_KEY = "task-ledger.tasks.v1";
    var THEME_KEY = "task-ledger.theme.v1";
    var VIEW_KEY = "task-ledger.view.v1";

    var STATUSES = [
      { key: "notstarted", label: "未着手", icon: "radio_button_unchecked" },
      { key: "inprogress", label: "着手中", icon: "adjust" },
      { key: "done", label: "完了", icon: "check_circle" }
    ];
    var STATUS_CYCLE = { notstarted: "inprogress", inprogress: "done", done: "notstarted" };
    var TABS = [{ key: "all", label: "すべて" }].concat(STATUSES.map(function (s) { return { key: s.key, label: s.label }; }));
    var PRIORITIES = [
      { key: "high", label: "高" },
      { key: "mid", label: "中" },
      { key: "low", label: "低" }
    ];
    var PRIORITY_CYCLE = { high: "mid", mid: "low", low: "high" };
    var PRIORITY_ICON = { high: "flag", mid: "flag", low: "outlined_flag" };

    var GANTT_DAY_W = 32;
    var GANTT_NAME_W = 160;
    var GANTT_MAX_DAYS = 180;

    var ui = {
      theme: loadTheme(),
      view: loadView(),
      tab: "all",
      query: "",
      tagFilter: new Set(),
      priorityFilter: new Set(),
      dueFilter: "all",
      filterOpen: false,
      expanded: new Set(),
      editingId: null,
      draftPriority: "mid"
    };
    applyTheme();

    var tasks = load();

    var els = {
      composer: document.getElementById("composer"),
      taskInput: document.getElementById("task-input"),
      draftStart: document.getElementById("draft-start"),
      draftDue: document.getElementById("draft-due"),
      draftPriority: document.getElementById("draft-priority"),
      draftTags: document.getElementById("draft-tags"),
      tagList: document.getElementById("tag-list"),
      searchInput: document.getElementById("search-input"),
      searchClear: document.getElementById("search-clear"),
      filterToggle: document.getElementById("filter-toggle"),
      filterBadge: document.getElementById("filter-badge"),
      filterPanel: document.getElementById("filter-panel"),
      filterTags: document.getElementById("filter-tags"),
      filterPriority: document.getElementById("filter-priority"),
      filterDue: document.getElementById("filter-due"),
      filterClear: document.getElementById("filter-clear"),
      themeSwitch: document.getElementById("theme-switch"),
      viewSwitch: document.getElementById("view-switch"),
      tabs: document.getElementById("tabs"),
      bulkBar: document.getElementById("bulk-bar"),
      bulkComplete: document.getElementById("bulk-complete"),
      bulkDelete: document.getElementById("bulk-delete"),
      list: document.getElementById("list"),
      board: document.getElementById("board"),
      ganttContainer: document.getElementById("gantt-container"),
      ganttNote: document.getElementById("gantt-note"),
      ganttTable: document.getElementById("gantt-table")
    };

    var dragState = null;

    /* ---------- theme & view persistence ---------- */

    function loadTheme() {
      var v;
      try { v = localStorage.getItem(THEME_KEY); } catch (e) { v = null; }
      return (v === "light" || v === "dark") ? v : "system";
    }
    function saveTheme(v) { try { localStorage.setItem(THEME_KEY, v); } catch (e) {} }
    function applyTheme() {
      if (ui.theme === "light") document.documentElement.setAttribute("data-theme", "light");
      else if (ui.theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
      else document.documentElement.removeAttribute("data-theme");
    }

    function loadView() {
      var v;
      try { v = localStorage.getItem(VIEW_KEY); } catch (e) { v = null; }
      return (v === "board" || v === "gantt") ? v : "list";
    }
    function saveView(v) { try { localStorage.setItem(VIEW_KEY, v); } catch (e) {} }

    /* ---------- task persistence ---------- */

    function load() {
      var raw;
      try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { raw = null; }
      var parsed;
      try { parsed = raw ? JSON.parse(raw) : []; } catch (e) { parsed = []; }
      if (!Array.isArray(parsed)) parsed = [];
      return parsed.map(normalizeTask);
    }

    function normalizeTask(t) {
      return {
        id: t.id || makeId(),
        text: typeof t.text === "string" ? t.text : "",
        status: STATUSES.some(function (s) { return s.key === t.status; }) ? t.status : "notstarted",
        priority: PRIORITIES.some(function (p) { return p.key === t.priority; }) ? t.priority : "mid",
        startDate: t.startDate || "",
        dueDate: t.dueDate || "",
        tags: Array.isArray(t.tags) ? t.tags.filter(Boolean) : [],
        subtasks: Array.isArray(t.subtasks) ? t.subtasks.map(function (s) {
          return { id: s.id || makeId(), text: s.text || "", done: !!s.done };
        }) : []
      };
    }

    function save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch (e) {}
    }

    function makeId() {
      return "id" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    }

    function todayISO() {
      var d = new Date();
      var m = String(d.getMonth() + 1).padStart(2, "0");
      var day = String(d.getDate()).padStart(2, "0");
      return d.getFullYear() + "-" + m + "-" + day;
    }

    function parseISODate(s) {
      var p = s.split("-").map(Number);
      return new Date(p[0], p[1] - 1, p[2]);
    }
    function addDays(d, n) { var r = new Date(d); r.setDate(r.getDate() + n); return r; }
    function dayDiff(a, b) { return Math.round((b - a) / 86400000); }
    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    /* ---------- mutations ---------- */

    function addTask(text, startDate, dueDate, priority, tags) {
      tasks.unshift({
        id: makeId(),
        text: text,
        status: "notstarted",
        priority: priority || "mid",
        startDate: startDate || "",
        dueDate: dueDate || "",
        tags: tags || [],
        subtasks: []
      });
      save();
      render();
    }

    function findTask(id) { return tasks.find(function (t) { return t.id === id; }); }

    function cycleStatus(id) {
      var t = findTask(id);
      if (!t) return;
      t.status = STATUS_CYCLE[t.status];
      save();
      render();
    }

    function cyclePriority(id) {
      var t = findTask(id);
      if (!t) return;
      t.priority = PRIORITY_CYCLE[t.priority];
      save();
      render();
    }

    function setStartDate(id, value) {
      var t = findTask(id);
      if (!t) return;
      t.startDate = value || "";
      save();
      render();
    }

    function setDueDate(id, value) {
      var t = findTask(id);
      if (!t) return;
      t.dueDate = value || "";
      save();
      render();
    }

    function setText(id, text) {
      var t = findTask(id);
      if (!t) return;
      var trimmed = text.trim();
      if (trimmed) t.text = trimmed;
      ui.editingId = null;
      save();
      render();
    }

    function addTag(id, raw) {
      var t = findTask(id);
      if (!t) return;
      var parts = raw.split(/[,、]/).map(function (s) { return s.trim(); }).filter(Boolean);
      parts.forEach(function (tag) {
        if (t.tags.indexOf(tag) === -1) t.tags.push(tag);
      });
      save();
      render();
    }

    function removeTag(id, tag) {
      var t = findTask(id);
      if (!t) return;
      t.tags = t.tags.filter(function (x) { return x !== tag; });
      save();
      render();
    }

    function removeTask(id) {
      tasks = tasks.filter(function (t) { return t.id !== id; });
      save();
      render();
    }

    function addSubtask(id, text) {
      var t = findTask(id);
      if (!t || !text.trim()) return;
      t.subtasks.push({ id: makeId(), text: text.trim(), done: false });
      save();
      render();
    }

    function toggleSubtask(taskId, subId) {
      var t = findTask(taskId);
      if (!t) return;
      var s = t.subtasks.find(function (x) { return x.id === subId; });
      if (!s) return;
      s.done = !s.done;
      save();
      render();
    }

    function removeSubtask(taskId, subId) {
      var t = findTask(taskId);
      if (!t) return;
      t.subtasks = t.subtasks.filter(function (x) { return x.id !== subId; });
      save();
      render();
    }

    function reorder(draggedId, targetId, position, newStatus) {
      var fromIdx = tasks.findIndex(function (t) { return t.id === draggedId; });
      if (fromIdx < 0) return;
      var moved = tasks.splice(fromIdx, 1)[0];
      if (newStatus) moved.status = newStatus;
      var toIdx = tasks.findIndex(function (t) { return t.id === targetId; });
      if (toIdx < 0) toIdx = tasks.length;
      if (position === "after") toIdx += 1;
      tasks.splice(toIdx, 0, moved);
      save();
      render();
    }

    function moveToColumnEnd(draggedId, status) {
      var fromIdx = tasks.findIndex(function (t) { return t.id === draggedId; });
      if (fromIdx < 0) return;
      var moved = tasks.splice(fromIdx, 1)[0];
      moved.status = status;
      tasks.push(moved);
      save();
      render();
    }

    /* ---------- filtering ---------- */

    function allTags() {
      var set = new Set();
      tasks.forEach(function (t) { t.tags.forEach(function (tag) { set.add(tag); }); });
      return Array.from(set).sort();
    }

    function matchesFiltersExceptTab(t) {
      if (ui.query) {
        var q = ui.query.toLowerCase();
        var inText = t.text.toLowerCase().indexOf(q) !== -1;
        var inTags = t.tags.some(function (tag) { return tag.toLowerCase().indexOf(q) !== -1; });
        if (!inText && !inTags) return false;
      }
      if (ui.tagFilter.size > 0 && !t.tags.some(function (tag) { return ui.tagFilter.has(tag); })) return false;
      if (ui.priorityFilter.size > 0 && !ui.priorityFilter.has(t.priority)) return false;
      if (ui.dueFilter !== "all") {
        var today = todayISO();
        if (ui.dueFilter === "overdue" && !(t.dueDate && t.dueDate < today && t.status !== "done")) return false;
        if (ui.dueFilter === "today" && t.dueDate !== today) return false;
        if (ui.dueFilter === "upcoming" && !(t.dueDate && t.dueDate > today)) return false;
        if (ui.dueFilter === "none" && t.dueDate) return false;
      }
      return true;
    }

    function visibleTasks() {
      return tasks.filter(function (t) {
        if (ui.tab !== "all" && t.status !== ui.tab) return false;
        return matchesFiltersExceptTab(t);
      });
    }

    function visibleTasksIgnoringTab() {
      return tasks.filter(matchesFiltersExceptTab);
    }

    function activeFilterCount() {
      return ui.tagFilter.size + ui.priorityFilter.size + (ui.dueFilter !== "all" ? 1 : 0);
    }

    function dueState(t) {
      if (!t.dueDate) return "";
      var today = todayISO();
      if (t.dueDate < today && t.status !== "done") return "overdue";
      if (t.dueDate === today) return "today";
      return "";
    }

    /* ---------- rendering ---------- */

    function render() {
      renderTagList();
      renderDraftPriority();
      renderFilterToggle();
      renderFilterPanel();
      renderThemeSwitch();
      renderViewSwitch();

      var isList = ui.view === "list";
      els.tabs.style.display = isList ? "" : "none";
      els.bulkBar.style.display = isList ? "" : "none";
      els.list.style.display = isList ? "" : "none";
      els.board.style.display = ui.view === "board" ? "" : "none";
      els.ganttContainer.style.display = ui.view === "gantt" ? "" : "none";

      if (isList) {
        renderTabs();
        renderBulkBar();
        renderList();
      } else if (ui.view === "board") {
        renderBoard();
      } else {
        renderGantt();
      }
    }

    function renderTagList() {
      var tags = allTags();
      els.tagList.innerHTML = tags.map(function (tag) {
        return '<option value="' + escapeAttr(tag) + '"></option>';
      }).join("");
    }

    function renderDraftPriority() {

    function renderGantt() {
      var all = visibleTasksIgnoringTab();
      var ganttTasks = all.filter(function (t) { return !!t.dueDate; });
      var skipped = all.length - ganttTasks.length;

      var note = skipped > 0 ? ("期限が未設定のタスクが" + skipped + "件あります(ガントチャートには表示されません)") : "";

      if (ganttTasks.length === 0) {
        els.ganttNote.textContent = note;
        els.ganttTable.innerHTML = '<div class="empty" style="border:none;">期限が設定されたタスクがありません。</div>';
        return;
      }

      ganttTasks = ganttTasks.slice().sort(function (a, b) {
        var as = a.startDate || a.dueDate, bs = b.startDate || b.dueDate;
        return as < bs ? -1 : as > bs ? 1 : 0;
      });

      var todayD = parseISODate(todayISO());
      var minD = todayD, maxD = todayD;
      ganttTasks.forEach(function (t) {
        var s = parseISODate(t.startDate || t.dueDate);
        var e = parseISODate(t.dueDate);
        if (s < minD) minD = s;
        if (e > maxD) maxD = e;
      });
      minD = addDays(minD, -1);
      maxD = addDays(maxD, 1);

      var totalDays = dayDiff(minD, maxD) + 1;
      var truncated = false;
      if (totalDays > GANTT_MAX_DAYS) {
        maxD = addDays(minD, GANTT_MAX_DAYS - 1);
        totalDays = GANTT_MAX_DAYS;
        truncated = true;
      }

      els.ganttNote.textContent = note + (truncated ? (note ? " / " : "") + "表示期間が長いため直近" + GANTT_MAX_DAYS + "日分のみ表示しています。" : "");

      var todayIdx = dayDiff(minD, todayD);

      var table = document.createElement("div");
      table.className = "gantt-table";
      table.style.width = (GANTT_NAME_W + totalDays * GANTT_DAY_W) + "px";

      var header = document.createElement("div");
      header.className = "gantt-header-row";
      var headerName = document.createElement("div");
      headerName.className = "gantt-name-cell";
      headerName.textContent = "タスク";
      header.appendChild(headerName);
      var headerDays = document.createElement("div");
      headerDays.className = "gantt-days-header";
      for (var i = 0; i < totalDays; i++) {
        var d = addDays(minD, i);
        var cell = document.createElement("div");
        cell.className = "gantt-day-cell";
        if (d.getDay() === 0 || d.getDay() === 6) cell.classList.add("weekend");
        if (i === todayIdx) cell.classList.add("today");
        cell.textContent = (d.getMonth() + 1) + "/" + d.getDate();
        headerDays.appendChild(cell);
      }
      header.appendChild(headerDays);
      table.appendChild(header);

      var body = document.createElement("div");
      body.className = "gantt-body";

      ganttTasks.forEach(function (t) {
        var row = document.createElement("div");
        row.className = "gantt-row";
        row.setAttribute("data-status", t.status);

        var statusInfo = STATUSES.find(function (s) { return s.key === t.status; });
        var nameCell = document.createElement("div");
        nameCell.className = "gantt-name-cell";
        var iconColor = t.status === "inprogress" ? "var(--amber-fill)" : t.status === "done" ? "var(--green-fill)" : "var(--text-faint)";
        nameCell.innerHTML = '<span class="material-symbols-outlined' + (t.status === "done" ? " filled" : "") + '" style="color:' + iconColor + '">' + statusInfo.icon + '</span>' +
          '<span class="gantt-name-text">' + escapeHtml(t.text) + "</span>";
        row.appendChild(nameCell);

        var track = document.createElement("div");
        track.className = "gantt-track";
        track.style.width = (totalDays * GANTT_DAY_W) + "px";
        var bg = document.createElement("div");
        bg.className = "gantt-track-bg";
        track.appendChild(bg);

        var sIdx = clamp(dayDiff(minD, parseISODate(t.startDate || t.dueDate)), 0, totalDays - 1);
        var eIdx = clamp(dayDiff(minD, parseISODate(t.dueDate)), sIdx, totalDays - 1);
        var bar = document.createElement("div");
        bar.className = "gantt-bar";
        bar.setAttribute("data-status", t.status);
        if (t.priority === "high") bar.setAttribute("data-priority", "high");
        bar.style.left = (sIdx * GANTT_DAY_W) + "px";
        bar.style.width = Math.max(GANTT_DAY_W - 4, (eIdx - sIdx + 1) * GANTT_DAY_W - 4) + "px";
        bar.title = t.text + "(" + (t.startDate || t.dueDate) + " 〜 " + t.dueDate + ")";
        var barLabel = document.createElement("span");
        barLabel.className = "gantt-bar-label";
        barLabel.textContent = t.text;
        bar.appendChild(barLabel);
        track.appendChild(bar);

        row.appendChild(track);
        body.appendChild(row);
      });

      if (todayIdx >= 0 && todayIdx < totalDays) {
        var line = document.createElement("div");
        line.className = "gantt-today-line";
        line.style.left = (GANTT_NAME_W + todayIdx * GANTT_DAY_W) + "px";
        body.appendChild(line);
      }

      table.appendChild(body);
      els.ganttTable.innerHTML = "";
      els.ganttTable.appendChild(table);
    }

    /* ---------- drag & drop: list ---------- */

    function attachDrag(row, id) {
      row.addEventListener("dragstart", function (e) {
        if (!e.target.closest(".drag-handle")) { e.preventDefault(); return; }
        dragState = id;
        row.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        try { e.dataTransfer.setData("text/plain", id); } catch (err) {}
      });

      row.addEventListener("dragover", function (e) {
        if (!dragState || dragState === id) return;
        e.preventDefault();
        var rect = row.getBoundingClientRect();
        var before = (e.clientY - rect.top) < rect.height / 2;
        row.classList.toggle("drag-over-before", before);
        row.classList.toggle("drag-over-after", !before);
      });

      row.addEventListener("dragleave", function () {
        row.classList.remove("drag-over-before", "drag-over-after");
      });

      row.addEventListener("drop", function (e) {
        e.preventDefault();
        var position = row.classList.contains("drag-over-before") ? "before" : "after";
        row.classList.remove("drag-over-before", "drag-over-after");
        if (dragState && dragState !== id) reorder(dragState, id, position);
        dragState = null;
      });

      row.addEventListener("dragend", function () {
        row.classList.remove("dragging", "drag-over-before", "drag-over-after");
        dragState = null;
      });
    }

    /* ---------- drag & drop: board ---------- */

    function attachCardDrag(card, id) {
      card.addEventListener("dragstart", function (e) {
        if (!e.target.closest(".card-handle")) { e.preventDefault(); return; }
        dragState = id;
        card.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        try { e.dataTransfer.setData("text/plain", id); } catch (err) {}
      });

      card.addEventListener("dragover", function (e) {
        if (!dragState || dragState === id) return;
        e.preventDefault();
        e.stopPropagation();
        var rect = card.getBoundingClientRect();
        var before = (e.clientY - rect.top) < rect.height / 2;
        card.classList.toggle("drag-over-before", before);
        card.classList.toggle("drag-over-after", !before);
      });

      card.addEventListener("dragleave", function () {
        card.classList.remove("drag-over-before", "drag-over-after");
      });

      card.addEventListener("drop", function (e) {
        e.preventDefault();
        e.stopPropagation();
        var position = card.classList.contains("drag-over-before") ? "before" : "after";
        card.classList.remove("drag-over-before", "drag-over-after");
        if (dragState && dragState !== id) {
          var newStatus = card.closest(".board-col-body").dataset.status;
          reorder(dragState, id, position, newStatus);
        }
        dragState = null;
      });

      card.addEventListener("dragend", function () {
        card.classList.remove("dragging", "drag-over-before", "drag-over-after");
        dragState = null;
      });
    }

    function attachColumnDrop(colBody, status) {
      colBody.addEventListener("dragover", function (e) {
        if (!dragState) return;
        e.preventDefault();
        colBody.classList.add("drag-over-col");
      });
      colBody.addEventListener("dragleave", function (e) {
        if (e.target === colBody) colBody.classList.remove("drag-over-col");
      });
      colBody.addEventListener("drop", function (e) {
        e.preventDefault();
        colBody.classList.remove("drag-over-col");
        if (dragState) moveToColumnEnd(dragState, status);
        dragState = null;
      });
    }

    function escapeAttr(s) {
      return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
    }
    function escapeHtml(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    /* ---------- events ---------- */

    els.composer.addEventListener("submit", function (e) {
      e.preventDefault();
      var text = els.taskInput.value.trim();
      if (!text) return;
      var tags = els.draftTags.value.split(/[,、]/).map(function (s) { return s.trim(); }).filter(Boolean);
      addTask(text, els.draftStart.value, els.draftDue.value, ui.draftPriority, tags);
      els.taskInput.value = "";
      els.draftStart.value = "";
      els.draftDue.value = "";
      els.draftTags.value = "";
      ui.draftPriority = "mid";
      renderDraftPriority();
      els.taskInput.focus();
    });

    els.searchInput.addEventListener("input", function () {
      ui.query = els.searchInput.value;
      els.searchClear.style.display = ui.query ? "flex" : "none";
      render();
    });

    els.searchClear.addEventListener("click", function () {
      ui.query = "";
      els.searchInput.value = "";
      els.searchClear.style.display = "none";
      render();
    });

    els.filterToggle.addEventListener("click", function () {
      ui.filterOpen = !ui.filterOpen;
      renderFilterToggle();
      renderFilterPanel();
    });

    els.filterDue.addEventListener("change", function () {
      ui.dueFilter = els.filterDue.value;
      render();
    });

    els.filterClear.addEventListener("click", function () {
      ui.tagFilter.clear();
      ui.priorityFilter.clear();
      ui.dueFilter = "all";
      render();
    });

    els.themeSwitch.querySelectorAll(".theme-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        ui.theme = btn.dataset.themeValue;
        saveTheme(ui.theme);
        applyTheme();
        renderThemeSwitch();
      });
    });

    els.viewSwitch.querySelectorAll(".view-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        ui.view = btn.dataset.viewValue;
        saveView(ui.view);
        render();
      });
    });

    els.bulkComplete.addEventListener("click", function () {
      visibleTasks().forEach(function (t) { t.status = "done"; });
      save();
      render();
    });

    els.bulkDelete.addEventListener("click", function () {
      var ids = new Set(visibleTasks().filter(function (t) { return t.status === "done"; }).map(function (t) { return t.id; }));
      tasks = tasks.filter(function (t) { return !ids.has(t.id); });
      save();
      render();
    });

    render();
  })();
</script>
